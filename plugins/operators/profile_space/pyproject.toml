[project]
name = "ado-profile-space"
requires-python = ">=3.10,<3.15"
dependencies = [
  "ado-core>=2.0.0",
  "fg-data-profiling>=4.19.1",
]
dynamic = ["version"]

[project.entry-points."ado.operators"]
profile_space = "profile_space.operator"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["profile_space"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
pattern-prefix = "profile-space/"
fallback-version = "0.0.0"
format-jinja-imports = [{ module = "datetime", item = "datetime" }]
format-jinja = """
{%- set metadata = [
    distance != 0 and "g" ~ commit,
    distance != 0 and "d" ~ datetime.utcnow().strftime("%Y%m%d%H%M%S"),
    dirty and "dirty"
] -%}
{{ serialize_pep440(
    distance == 0 and base or bump_version(base),
    dev=distance or None,
    metadata=metadata | select | list
) }}
"""
