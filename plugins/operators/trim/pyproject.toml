[project]
name = "ado-trim"
description = "TRIM (Transfer Refined Iterative Modeling) builds an accurate predictive model from a small dataset by iteratively sampling a Discovery Space."
readme = "README.md"
# autogluon==1.5 requires pyarrow < 21, which is
# incompatible with Python 3.14
# ref: https://github.com/autogluon/autogluon/blob/master/core/src/autogluon/core/_setup_utils.py#L22
requires-python = ">=3.10,<3.14"
dependencies = [
  "ado-core",
  "autogluon-tabular[catboost,xgboost]==1.5",
  "numpy",
  "pandas>=2.2.0",
  "scikit-learn",
]
dynamic = ["version"]

[project.entry-points."ado.operators"]
trim = "trim.operator"

[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trim*"]

[tool.setuptools_scm]
root = "../../../"
local_scheme = "node-and-timestamp"
