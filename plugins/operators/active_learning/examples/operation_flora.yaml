spaces:
  - replace-with-a-space-identifier
operation:
  module:
    operationType: characterize
    operatorName: flora
  parameters:
    numberEntities: 20
    targetOutput: density
    nEstimators: 100
    minSamplesLeaf: 2
    seed: 42
    criterion: squared_error
    nJobs: -1
    labelWaitTimeoutSeconds: 300.0
    labelPollIntervalSeconds: 0.1
metadata:
  name: flora-density-example
  description: Adaptively sample the density space with FLORA.
