[project]
name = "ml_multi_cloud_custom_experiments"
description = "Custom experiments for ml multi cloud example"
dynamic = ["version"]

# Add entry point for custom experiments
[project.entry-points."ado.custom_experiments"]
ml_multi_cloud_custom_experiments = "ml_multi_cloud_custom_experiments.objective_function"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml_multi_cloud_custom_experiments"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
fallback-version = "0.0.0"
tagged-metadata = true
dirty = true
bump = true
