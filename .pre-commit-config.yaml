default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages: [pre-commit]
# AutoGluon model artefacts (pkl, json, txt, csv) must not be reformatted —
# even an end-of-file change can break model loading.
exclude: "plugins/custom_experiments/autoconf/autoconf/AutoGluonModels/(?!README\\.md|changelog\\.md)"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        # --unsafe is required to allow !!python/name: tags used in mkdocs.yml
        args: ["--unsafe"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=3000"]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/ibm/detect-secrets
    rev: 0.13.1+ibm.64.dss
    hooks:
      - id: detect-secrets # pragma: whitelist secret
        args: [--baseline, .secrets.baseline, --use-all-plugins, --fail-on-unaudited]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args:
          - --exclude
          - plugins/actuators/vllm_performance/ado_actuators/vllm_performance/vllm_performance_test
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --no-color
          - --verbose
          - --scopes
          - agents,anomalous-series,autoconf,changelog,ci,cli,container,contributing,core,cplex-mip,deps,docs,example-actuator,hooks,ordered-pip,profile-space,ray-tune,sfttrainer,test,trim,vllm-performance,website
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: ['tomli']
        args: ['--toml', 'pyproject.toml']
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.1
    hooks:
      - id: uv-lock
      - id: uv-export
        args: ["--frozen", "--no-emit-project", "--no-default-groups", "--output-file=requirements.txt"]
  - repo: https://github.com/hashicorp/copywrite
    rev: v0.25.3
    hooks:
      - id: add-headers
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2-docker
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.2.6
    hooks:
      - id: tombi-format
        args: ["--offline"]
