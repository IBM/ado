# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
# Same as Black.
line-length = 88
indent-width = 4
# Assume Python 3.10
target-version = "py310"

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  # "A",
  "ANN",
  "ASYNC",
  "B",
  "C4",
  # "D",
  #    "DOC", # requires preview
  #    "DTZ",
  "E",
  # "ERA",
  "EXE",
  "F",
  "FA",
  "FAST",
  # "FIX",
  "FLY",
  "FURB",
  # "G",
  "I",
  "ICN",
  "INT",
  "ISC",
  # "LOG",
  #    "N",
  "NPY",
  # "PD",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  # "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "S608",
  "SIM",
  "SLOT",
  "T10",
  # "T20",
  "TC",
  # "TD",
  "TID",
  # "TRY",
  "UP",
  "W",
  "YTT",
]
# E501 - line too long (https://docs.astral.sh/ruff/rules/line-too-long/)
# RUF100 - unused-noqa (https://docs.astral.sh/ruff/rules/unused-noqa/)
ignore = ["E501", "RUF100"]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore `F403` (from module import *) pytests conftest.py
# Ignore `I001` (unsorted imports) -> they are order-sensitive
"tests/conftest.py" = ["F403", "I001"]
# Ignore `S101` (Use of `assert` detected)
# Ignore `S105` (Possible hardcoded password assigned to)
# Ignore `S106` (Possible hardcoded password assigned to argument)
# Ignore `S108` (Probable insecure usage of temporary file or directory)
# Ignore `S311` (Standard pseudo-random generators are not suitable for cryptographic purposes)
"tests/*" = ["S101", "S105", "S106", "S108", "S311"]
"plugins/operators/trim/tests/*" = ["S101"]
"plugins/custom_experiments/autoconf/autoconf/test/*" = ["S101"]
"plugins/actuators/sfttrainer/ado_actuators/sfttrainer/tests/*" = ["S101"]
"plugins/custom_experiments/cplex_mip/tests/*" = ["S101"]
"plugins/actuators/vllm_performance/tests/*" = ["S101"]
# Here we are also testing type inference, annotations may be missing
# on purpose.
"tests/actuators/test_custom_experiments.py" = ["ANN"]
