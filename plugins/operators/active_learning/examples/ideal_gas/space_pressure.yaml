entitySpace:
  - identifier: temperature
    propertyDomain:
      domainRange: [270, 300]
      interval: 2
  - identifier: volume
    propertyDomain:
      domainRange: [1, 10]
      interval: 1
  - identifier: mol
    propertyDomain:
      domainRange: [0.1, 1]
      interval: 0.1
experiments:
  - actuatorIdentifier: custom_experiments
    experimentIdentifier: ideal_gas_pressure
metadata:
  name: active-learning-ideal-gas-space
  description: A discrete ideal-gas pressure space for predictive sampling.
  labels:
    example: ideal-gas
    workflow: active-learning
