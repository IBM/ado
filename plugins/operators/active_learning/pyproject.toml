[project]
name = "ado-active-learning"
description = "Active learning characterization operators for ADO discovery spaces."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  # The 2.3.1 maintenance release lacks the typed operator parameters on main.
  "ado-core>=2.3.1.dev51,!=2.3.1",
  "numpy",
  "pandas>=2.2.0",
  "scikit-learn>=1.6",
]
dynamic = ["version"]

[project.entry-points."ado.operators"]
flora = "active_learning.flora.operator"
pkh = "active_learning.pkh.operator"

[project.optional-dependencies]
autogluon = [
  "autogluon-tabular[catboost,xgboost]==1.6.3 ; python_full_version < '3.14'",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/active_learning"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
pattern-prefix = "active-learning/"
fallback-version = "0.2.0"
format-jinja-imports = [{ module = "datetime", item = "datetime" }]
format-jinja = """
{%- set metadata = [
    distance != 0 and "g" ~ commit,
    distance != 0 and "d" ~ datetime.utcnow().strftime("%Y%m%d%H%M%S"),
    dirty and "dirty"
] -%}
{{ serialize_pep440(
    distance == 0 and base or bump_version(base),
    dev=distance or None,
    metadata=metadata | select | list
) }}
"""
