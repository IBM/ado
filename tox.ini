[tox]
# Test matrix: Python versions 3.10-3.13 with locked/nonlocked dependencies on darwin/linux
# Default: locked dependencies on Linux
envlist = py3{10,11,12,13,14}-locked-linux

# Unified test environment configuration with factor-based conditional logic
[testenv:py3{10,11,12,13,14}-{locked,nonlocked}-{macos,linux}]
# Dynamic runner selection based on locked/nonlocked factor
runner =
    locked: uv-venv-lock-runner
    nonlocked: uv-venv-runner

# Platform-specific configuration
platform =
    macos: darwin
    linux: linux

# Dynamic description based on factors
description =
    macos-locked: Tests with locked dependencies on macOS machines
    macos-nonlocked: Tests with unlocked dependencies on macOS machines
    linux-locked: Tests with locked dependencies on Linux machines
    linux-nonlocked: Tests with unlocked dependencies on Linux machines

# Pass through CI environment variable for CI/CD detection
passenv=
    CI
    SOURCE_DATE_EPOCH

# Environment variables for test execution
setenv=
    LC_ALL=en_GB.UTF-8
    LOGLEVEL=DEBUG
    RAY_TASK_MAX_RETRIES=0
    RAY_SCHEDULER_EVENTS=0

# uv sync reads and respects the sources section, which
# does not happen with uv pip.
#
# When using the unlocked runners, do not install the
# test dependencies, and install them via their path
# in the deps section.
dependency_groups =
    dev
    locked: test

deps =
    nonlocked:
        .
        cloudpickle>=3.1.2
        examples/density_example
        examples/optimization_test_functions/custom_experiments
        examples/pfas-generative-models/custom_actuator_function
        examples/trim/custom_experiments
        plugins/actuators/example_actuator
        plugins/actuators/sfttrainer; python_version < '3.13'
        plugins/actuators/vllm_performance
        plugins/custom_experiments/autoconf; python_version < '3.14'
        plugins/operators/anomalous_series
        plugins/operators/profile_space; python_version < '3.14'
        plugins/operators/ray_tune
        plugins/operators/trim; python_version < '3.14'

# External commands allowed to be executed
allowlist_externals=
    printenv
    ls
    pwd
    rm
    uv
    pip
    cd

# Test commands executed in sequence
commands=
    # Display environment variables for debugging
    printenv

    # List installed packages
    uv pip list

    # Core test suite with coverage, parallel execution, and work stealing
    pytest -n auto --cov=ado --cov=plugins/operators --dist loadgroup -rx -vv --log-level=INFO --color=yes tests/

    # SFTTrainer tests (skipped on Python 3.13 and 3.14 due to compatibility issues)
    !py313-!py314: pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/actuators/sfttrainer/ado_actuators/sfttrainer/tests/

    # Autoconf plugin tests (skipped on Python 3.14 due to fastai/spacy compatibility issues)
    !py314: pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/custom_experiments/autoconf/autoconf/test/

    # TRIM operator tests (skipped on Python 3.14 due to Autogluon pyarrow compatibility issues)
    !py314: pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/operators/trim/tests

    # vLLM performance actuator tests
    pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/actuators/vllm_performance/tests/

    # Ray Tune operator functionality tests
    pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/operators/ray_tune/tests/

    # Cplex Custom experiment
    uv pip install plugins/custom_experiments/cplex_mip
    pytest -n auto --dist worksteal -rx -vv --log-level=INFO --color=yes plugins/custom_experiments/cplex_mip/tests/
