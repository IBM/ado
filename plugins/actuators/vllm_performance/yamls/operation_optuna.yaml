    operationType: "explore"
  parameters:
    tuneConfig:
      metric: "request_throughput" # The metric to optimize
      mode: 'max'
      num_samples: 20
      search_alg:
        name: optuna
        params:
          sampler: TPESampler
          sampler_parameters:
            n_startup_trials: 10 # Number of random samples before optimization
