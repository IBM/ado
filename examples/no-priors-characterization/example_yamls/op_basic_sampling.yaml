# CLHS space-filling configuration using random_walk with no-priors sampler
spaces:
  - space-c8717f-3a68bf
operation:
  module:
    operationType: explore
    operatorName: random_walk
  parameters:
    numberEntities: 30
    batchSize: 1
    samplerConfig:
      module:
        moduleName: orchestrator.core.discoveryspace.no_priors_sampler
        moduleClass: NoPriorsSampleSelector
      parameters:
        targetOutput: yield
        samples: 30
        batchSize: 1
        sampling_strategy: clhs
    singleMeasurement: true
    filter:
      filterMode: unmeasured

