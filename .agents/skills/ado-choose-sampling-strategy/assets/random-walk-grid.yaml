# Full-factorial (grid) sweep of a finite space.
# filterMode: unmeasured lets the same YAML resume an interrupted sweep
# without replaying entities that are already measured.
spaces:
  - space-abc123
operation:
  module:
    operatorName: random_walk
    operationType: explore
  parameters:
    numberEntities: all
    batchSize: 4 # concurrency: batchSize x number of experiments
    samplerConfig:
      samplerType: generator
      mode: sequential
    filter:
      filterMode: unmeasured
metadata:
  name: grid-sweep
  description: Measure every entity in the space
