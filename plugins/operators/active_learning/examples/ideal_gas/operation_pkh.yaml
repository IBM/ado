inputs:
  discoverySpace:
    identifier: calculate_pressure_0-0-0
    kind: discoveryspace
operation:
  module:
    operationType: characterize
    operatorName: pkh
  parameters:
    targetOutput: pressure
    numberEntities: 20
    pilotSize: 5
    epochLength: 5
    nEstimators: 100
    minSamplesLeaf: 2
    maxFeatures: 1.0
    criterion: squared_error
    seed: 42
    # Use weighted_ensemble to compare five tree families, or autogluon to use
    # the preset's installed models. Both compare single models and their
    # weighted ensemble by validation RMSE.
    finalPredictor: random_forest
