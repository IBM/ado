# Optuna TPE for a mixed categorical/discrete space.
# To warm start, add already-measured or known-good entities as
# points_to_evaluate under search_alg.params.
spaces:
  - space-abc123
operation:
  module:
    operatorName: ray_tune
    operationType: explore
  parameters:
    tuneConfig:
      metric: wallclock_time
      mode: min
      num_samples: 100
      max_concurrent_trials: 4
      search_alg:
        name: optuna
        params:
          sampler: TPESampler
          sampler_parameters:
            n_startup_trials: 20 # random warm-up trials
            multivariate: true # model interactions between dimensions
            seed: 42
    runtimeConfig:
      stop:
        - name: MaxSamplesStopper # enforces the budget; num_samples is interpreted per optimizer
          keywordParams:
            max_samples: 100
        - name: SimpleStopper
          keywordParams:
            mode: min
            metric: wallclock_time
            min_trials: 30
            buffer_states: 40
            stop_on_repeat: false # TPE re-suggests points in small discrete spaces
metadata:
  name: tpe-wallclock-min
  description: Minimise wallclock_time with Optuna TPE
