# Baseline random ordering using random_walk with no-priors sampler
spaces:
  - space-c8717f-3a68bf
operation:
  module:
    operationType: explore
    operatorName: random_walk
  parameters:
    numberEntities: 20
    batchSize: 5
    samplerConfig:
      module:
        moduleName: orchestrator.core.discoveryspace.no_priors_sampler
        moduleClass: NoPriorsSampleSelector
      parameters:
        targetOutput: yield
        samples: 20
        batchSize: 5
        sampling_strategy: random
    singleMeasurement: true
    filter:
      filterMode: unmeasured

