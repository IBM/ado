apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-deployer
rules:
  - apiGroups: ["ray.io"]
    resources:
      - rayclusters
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources:
      - pods
      - deployments
    verbs: ["get", "create", "delete", "list", "watch", "update"]
  - apiGroups: [""]
    resources:
      - services
      - persistentvolumeclaims
    verbs: ["get", "create", "delete", "list", "watch", "update"]
