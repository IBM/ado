spaces:
  - replace-with-a-space-identifier
operation:
  module:
    operationType: characterize
    operatorName: flora
  parameters:
    numberEntities: 20
    finalPredictor: random_forest
    targetOutput: pressure
    pilotSize: 5
    pilotStrategy: random
    maxFeatures: sqrt
    seed: 42
    nJobs: 1
    outputDirectory: flora_models
metadata:
  name: flora-ideal-gas-example
  description: Measure twenty ideal-gas configurations selected by FLORA.
  labels:
    example: ideal-gas
    operator: flora
