[project]
name = "ado-ray-tune"
dependencies = [
  "ado-core>=2.0.0",
  "bayesian-optimization>=1.4.0",
  "nevergrad>=1.0.12",
  # Numba added support for Python 3.14 only in
  # version 0.63.0. By adding this requirement explicitly
  # we help uv perform a forked resolution for the lockfile.
  "numba>=0.63.0 ; python_full_version >= '3.14'",
  "pandas<4",
  "paretoset>=1.2.4",
  # botocore → urllib3 → OpenSSL.SSL import chain fails with AttributeError
  # on GEN_EMAIL if pyopenssl is too old.  No dep in the chain pins a minimum
  # version that includes the fix, so we pin it explicitly here.
  "pyopenssl>=23.0.0",
  "ray[tune]>=2.9",
  "scipy>=1.15.3",
  # Scipy's first full release that supports Python 3.14
  # (1.17.0) requires numpy>=1.26.4
  # ref: https://github.com/scipy/scipy/releases/tag/v1.17.0
  "scipy>=1.17.0 ; python_full_version >= '3.14'",
]
dynamic = ["version"]

[project.entry-points."ado.operators"]
ado-ray-tune = "ado_ray_tune.operator"
rifferla = "ado_ray_tune.rifferla"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["ado_ray_tune"]

[tool.uv.sources]
ado-core = { workspace = true }

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
pattern-prefix = "ray-tune/"
fallback-version = "0.0.0"
format-jinja = """
{%- set metadata = [
    distance != 0 and "g" ~ commit,
    distance != 0 and "d" ~ timestamp,
    dirty and "dirty"
] -%}
{{ serialize_pep440(
    distance == 0 and base or bump_version(base),
    dev=distance or None,
    metadata=metadata | select | list
) }}
"""
