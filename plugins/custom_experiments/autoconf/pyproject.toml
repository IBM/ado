[project]
name = "ado-autoconf"
description = "An AutoConf plugin that suggests the minimum number of gpus necessary to execute a Tuning job"
requires-python = ">=3.10,<3.14"
dependencies = [
  "ado-core>=2.0.0",
  "autogluon-tabular[catboost,xgboost]==1.5.0 ; python_full_version < '3.14'",
  "pandas<3.0.6",
  "pydantic",
  "torch",
]
dynamic = ["version"]

[project.entry-points."ado.custom_experiments"]
min_gpu_experiment = "autoconf.min_gpu_recommender"

[project.optional-dependencies]
libomp = ["autogluon.tabular[lightgbm]"]

[dependency-groups]
dev = [
  "pytest>=9.0.1",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoconf"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
pattern-prefix = "autoconf/"
fallback-version = "0.0.0"
format-jinja = """
{%- set metadata = [
    distance != 0 and "g" ~ commit,
    distance != 0 and "d" ~ timestamp,
    dirty and "dirty"
] -%}
{{ serialize_pep440(
    distance == 0 and base or bump_version(base),
    dev=distance or None,
    metadata=metadata | select | list
) }}
"""
