[project]
name = "ado-active-learning"
description = "Adaptive random-forest characterization operators for ADO finite discovery spaces."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "ado-core>=2.1.0",
  "numpy",
  "pandas>=2.2.0",
  "scikit-learn>=1.6",
]
dynamic = ["version"]

[project.entry-points."ado.operators"]
pkh = "active_learning.regression.pkh.operator"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/active_learning"]

[tool.uv.sources]
ado-core = { workspace = true }

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
pattern-prefix = "active-learning/"
fallback-version = "0.1.0"
format-jinja = """
{%- set metadata = [
    distance != 0 and "g" ~ commit,
    distance != 0 and "d" ~ timestamp,
    dirty and "dirty"
] -%}
{{ serialize_pep440(
    distance == 0 and base or bump_version(base),
    dev=distance or None,
    metadata=metadata | select | list
) }}
"""
